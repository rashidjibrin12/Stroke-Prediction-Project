<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Stroke correlation heatmap</title>
  <desc id="desc">A heatmap showing relationships between stroke risk variables and patient factors.</desc>
  <defs>
    <linearGradient id="heat" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="40%" stop-color="#bfd3e6"/>
      <stop offset="70%" stop-color="#6e9ec6"/>
      <stop offset="100%" stop-color="#1c3f7a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#f5f7fb"/>
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1d3557">Stroke Risk Correlation Heatmap</text>

  <g transform="translate(120,120)">
    <rect x="0" y="0" width="620" height="620" fill="#ffffff" stroke="#dfe7f4" stroke-width="2"/>

    <!-- Labels -->
    <g font-size="18" fill="#2b3d59" font-family="Arial, sans-serif">
      <text x="130" y="28" transform="rotate(-35 130,28)">Age</text>
      <text x="190" y="28" transform="rotate(-35 190,28)">Gender</text>
      <text x="250" y="28" transform="rotate(-35 250,28)">BMI</text>
      <text x="310" y="28" transform="rotate(-35 310,28)">Glucose</text>
      <text x="370" y="28" transform="rotate(-35 370,28)">Hypertension</text>
      <text x="430" y="28" transform="rotate(-35 430,28)">Heart</text>
      <text x="490" y="28" transform="rotate(-35 490,28)">Smoking</text>
      <text x="550" y="28" transform="rotate(-35 550,28)">Stroke</text>

      <text x="-12" y="80" text-anchor="end">Age</text>
      <text x="-12" y="140" text-anchor="end">Gender</text>
      <text x="-12" y="200" text-anchor="end">BMI</text>
      <text x="-12" y="260" text-anchor="end">Glucose</text>
      <text x="-12" y="320" text-anchor="end">Hypertension</text>
      <text x="-12" y="380" text-anchor="end">Heart</text>
      <text x="-12" y="440" text-anchor="end">Smoking</text>
      <text x="-12" y="500" text-anchor="end">Stroke</text>
    </g>

    <!-- Grid cells -->
    <g transform="translate(60,40)">
      <g>
        <rect x="0" y="0" width="70" height="70" fill="#f7fbff"/>
        <rect x="70" y="0" width="70" height="70" fill="#dfeaf4"/>
        <rect x="140" y="0" width="70" height="70" fill="#d1dff0"/>
        <rect x="210" y="0" width="70" height="70" fill="#b6cfe9"/>
        <rect x="280" y="0" width="70" height="70" fill="#8db5d9"/>
        <rect x="350" y="0" width="70" height="70" fill="#517eb2"/>
        <rect x="420" y="0" width="70" height="70" fill="#2a4f7d"/>
        <rect x="490" y="0" width="70" height="70" fill="#1f3554"/>

        <rect x="0" y="70" width="70" height="70" fill="#dfeaf4"/>
        <rect x="70" y="70" width="70" height="70" fill="#f4f6fb"/>
        <rect x="140" y="70" width="70" height="70" fill="#e9edf6"/>
        <rect x="210" y="70" width="70" height="70" fill="#d2dceb"/>
        <rect x="280" y="70" width="70" height="70" fill="#b7d2ec"/>
        <rect x="350" y="70" width="70" height="70" fill="#7ba0d5"/>
        <rect x="420" y="70" width="70" height="70" fill="#3d5f9b"/>
        <rect x="490" y="70" width="70" height="70" fill="#1c3871"/>

        <rect x="0" y="140" width="70" height="70" fill="#d6e5f5"/>
        <rect x="70" y="140" width="70" height="70" fill="#edf2f8"/>
        <rect x="140" y="140" width="70" height="70" fill="#f3f6fb"/>
        <rect x="210" y="140" width="70" height="70" fill="#dfeaf5"/>
        <rect x="280" y="140" width="70" height="70" fill="#adcaec"/>
        <rect x="350" y="140" width="70" height="70" fill="#7aa3d8"/>
        <rect x="420" y="140" width="70" height="70" fill="#395d9b"/>
        <rect x="490" y="140" width="70" height="70" fill="#19386d"/>

        <rect x="0" y="210" width="70" height="70" fill="#bfd7ee"/>
        <rect x="70" y="210" width="70" height="70" fill="#dfeaf4"/>
        <rect x="140" y="210" width="70" height="70" fill="#ddeaf8"/>
        <rect x="210" y="210" width="70" height="70" fill="#f4f7fb"/>
        <rect x="280" y="210" width="70" height="70" fill="#a8c9eb"/>
        <rect x="350" y="210" width="70" height="70" fill="#5d8ec8"/>
        <rect x="420" y="210" width="70" height="70" fill="#315d9b"/>
        <rect x="490" y="210" width="70" height="70" fill="#1a3d7b"/>

        <rect x="0" y="280" width="70" height="70" fill="#8db7dc"/>
        <rect x="70" y="280" width="70" height="70" fill="#bdd9f0"/>
        <rect x="140" y="280" width="70" height="70" fill="#a7c8eb"/>
        <rect x="210" y="280" width="70" height="70" fill="#9cc1eb"/>
        <rect x="280" y="280" width="70" height="70" fill="#f6f9fe"/>
        <rect x="350" y="280" width="70" height="70" fill="#8cb1d8"/>
        <rect x="420" y="280" width="70" height="70" fill="#335d9d"/>
        <rect x="490" y="280" width="70" height="70" fill="#17346d"/>

        <rect x="0" y="350" width="70" height="70" fill="#5d8bc0"/>
        <rect x="70" y="350" width="70" height="70" fill="#7ea8d4"/>
        <rect x="140" y="350" width="70" height="70" fill="#6b9fd0"/>
        <rect x="210" y="350" width="70" height="70" fill="#5d8ec0"/>
        <rect x="280" y="350" width="70" height="70" fill="#8ab5dd"/>
        <rect x="350" y="350" width="70" height="70" fill="#f2f6fb"/>
        <rect x="420" y="350" width="70" height="70" fill="#3e649f"/>
        <rect x="490" y="350" width="70" height="70" fill="#1d3972"/>

        <rect x="0" y="420" width="70" height="70" fill="#2d5c9d"/>
        <rect x="70" y="420" width="70" height="70" fill="#4c7bb3"/>
        <rect x="140" y="420" width="70" height="70" fill="#4d75af"/>
        <rect x="210" y="420" width="70" height="70" fill="#3967a7"/>
        <rect x="280" y="420" width="70" height="70" fill="#436ea9"/>
        <rect x="350" y="420" width="70" height="70" fill="#4379b2"/>
        <rect x="420" y="420" width="70" height="70" fill="#f5f8fd"/>
        <rect x="490" y="420" width="70" height="70" fill="#243d69"/>

        <rect x="0" y="490" width="70" height="70" fill="#1d3466"/>
        <rect x="70" y="490" width="70" height="70" fill="#233d6d"/>
        <rect x="140" y="490" width="70" height="70" fill="#23487c"/>
        <rect x="210" y="490" width="70" height="70" fill="#1d3f77"/>
        <rect x="280" y="490" width="70" height="70" fill="#1f4278"/>
        <rect x="350" y="490" width="70" height="70" fill="#1d3d72"/>
        <rect x="420" y="490" width="70" height="70" fill="#284b80"/>
        <rect x="490" y="490" width="70" height="70" fill="#ffffff"/>
      </g>
    </g>

    <!-- Legend -->
    <g transform="translate(420,560)">
      <rect x="0" y="0" width="170" height="24" fill="url(#heat)" stroke="#c9d5e7"/>
      <text x="0" y="-8" font-size="15" fill="#2b3d59" font-family="Arial, sans-serif">Low</text>
      <text x="130" y="-8" font-size="15" fill="#2b3d59" font-family="Arial, sans-serif" text-anchor="end">High</text>
    </g>
  </g>
</svg>





































































































































































































