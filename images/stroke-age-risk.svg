<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Age and stroke risk distribution</title>
  <desc id="desc">A chart showing how age-related stroke risk increases across the dataset.</desc>
  <defs>
    <linearGradient id="barGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#76b7f2"/>
      <stop offset="100%" stop-color="#164f96"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="#f5f7fb"/>
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1d3557">Age Distribution and Stroke Risk</text>

  <g transform="translate(120,100)">
    <rect x="0" y="0" width="960" height="500" fill="#ffffff" stroke="#dfe7f4" stroke-width="2"/>

    <!-- Axes -->
    <line x1="80" y1="430" x2="900" y2="430" stroke="#4d5e75" stroke-width="2"/>
    <line x1="80" y1="50" x2="80" y2="430" stroke="#4d5e75" stroke-width="2"/>

    <!-- Y-axis labels -->
    <g font-size="16" fill="#2b3d59" font-family="Arial, sans-serif">
      <text x="30" y="435" text-anchor="end">0</text>
      <text x="30" y="330" text-anchor="end">25%</text>
      <text x="30" y="225" text-anchor="end">50%</text>
      <text x="30" y="120" text-anchor="end">75%</text>
    </g>

    <!-- Bars -->
    <g>
      <rect x="110" y="180" width="40" height="250" fill="#9cc4eb"/>
      <rect x="170" y="140" width="40" height="290" fill="#7eb3e6"/>
      <rect x="230" y="120" width="40" height="310" fill="#6aa5df"/>
      <rect x="290" y="100" width="40" height="330" fill="#4f8ed2"/>
      <rect x="350" y="95" width="40" height="335" fill="#3d7dc6"/>
      <rect x="410" y="90" width="40" height="340" fill="#2b6ab3"/>
      <rect x="470" y="85" width="40" height="345" fill="#1d5aa5"/>
      <rect x="530" y="120" width="40" height="310" fill="#184f92"/>
      <rect x="590" y="150" width="40" height="280" fill="#133e73"/>
      <rect x="650" y="200" width="40" height="230" fill="#102d5a"/>
    </g>

    <!-- Line showing increase in stroke prevalence -->
    <polyline fill="none" stroke="#d94c4c" stroke-width="4" points="110,330 170,280 230,240 290,210 350,188 410,160 470,138 530,170 590,210 650,270"/>

    <!-- Age labels -->
    <g font-size="16" fill="#2b3d59" font-family="Arial, sans-serif">
      <text x="110" y="455" text-anchor="middle">20</text>
      <text x="170" y="455" text-anchor="middle">30</text>
      <text x="230" y="455" text-anchor="middle">40</text>
      <text x="290" y="455" text-anchor="middle">50</text>
      <text x="350" y="455" text-anchor="middle">60</text>
      <text x="410" y="455" text-anchor="middle">70</text>
      <text x="470" y="455" text-anchor="middle">80</text>
      <text x="530" y="455" text-anchor="middle">90</text>
      <text x="590" y="455" text-anchor="middle">100</text>
      <text x="650" y="455" text-anchor="middle">110</text>
    </g>

    <!-- Legend -->
    <g transform="translate(700,90)">
      <rect x="0" y="0" width="150" height="24" fill="#5ca0d6"/>
      <text x="175" y="18" font-size="16" fill="#2b3d59" font-family="Arial, sans-serif">Risk trend</text>
      <line x1="0" y1="52" x2="150" y2="52" stroke="#d94c4c" stroke-width="4"/>
      <text x="175" y="58" font-size="16" fill="#2b3d59" font-family="Arial, sans-serif">Stroke likelihood</text>
    </g>
  </g>
</svg>
